<svg xmlns="http://www.w3.org/2000/svg" width="942" height="398" viewBox="0 0 942 398" role="img" font-family='system-ui, -apple-system, "Segoe UI", sans-serif'>
<title>Six-minute sessions: compute per 30 seconds</title><desc>Share of real time each stack spent computing, per 30 s of audio, across one continuous 6-minute session per language. Above 1.0 a stack falls behind the microphone. No stack came near it.</desc>
